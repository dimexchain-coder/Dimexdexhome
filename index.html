<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DimeX Exchange — Markets & Swap</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #121826;
      --panel-2: #182133;
      --border: #25324b;
      --text: #eef3fc;
      --muted: #93a4c3;
      --accent: #f5b942;
      --buy: #16a34a;
      --buy-hover: #15803d;
      --sell: #dc2626;
      --sell-hover: #b91c1c;
      --chip: #1c273d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.45; }

    /* Top Header & Network Bar */
    .topbar {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 18px;
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
    .brand img { width: 34px; height: 34px; border-radius: 50%; object-fit: contain; border: 1px solid var(--accent); background: #0d1629; }
    .brand span small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }

    .network-strip { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .net-btn {
      background: var(--chip);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 13px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: 0.15s;
    }
    .net-btn:hover { border-color: var(--accent); }
    .net-btn.active { background: var(--accent); color: #111; border-color: var(--accent); }

    .currency-wrap { display: flex; align-items: center; gap: 8px; }
    .currency-select {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .container { max-width: 1380px; margin: 0 auto; padding: 18px; display: grid; gap: 18px; }

    /* Selected Coin Graph + Detail + Buy/Sell Stage */
    .stage {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 18px;
    }
    @media (max-width: 980px) { .stage { grid-template-columns: 1fr; } }

    .coin-hero { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 12px; }
    .coin-identity { display: flex; align-items: center; gap: 12px; }
    .coin-identity img { width: 46px; height: 46px; border-radius: 50%; object-fit: contain; background: var(--panel-2); border: 1px solid var(--border); }
    .coin-price-box { text-align: right; }
    .live-price { font-size: 24px; font-weight: 800; color: var(--accent); }
    .pnl-tag { font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 6px; display: inline-block; margin-top: 2px; }
    .pos { background: rgba(22, 163, 74, 0.18); color: #4ade80; }
    .neg { background: rgba(220, 38, 38, 0.18); color: #f87171; }

    .chart-box {
      background: #0d1320;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 14px;
    }
    canvas { width: 100%; height: 220px; display: block; }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .detail-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .detail-card label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .detail-card strong { font-size: 14px; font-weight: 700; }

    .trade-actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn-buy, .btn-sell {
      flex: 1;
      min-width: 140px;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-buy { background: var(--buy); }
    .btn-buy:hover { background: var(--buy-hover); }
    .btn-sell { background: var(--sell); }
    .btn-sell:hover { background: var(--sell-hover); }

    /* Swap Drawer / Box */
    .swap-panel {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }
    .swap-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .swap-tab {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }
    .swap-tab.buy-active { background: var(--buy); border-color: var(--buy); color: #fff; }
    .swap-tab.sell-active { background: var(--sell); border-color: var(--sell); color: #fff; }

    .swap-field {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .swap-field-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .swap-row { display: flex; gap: 8px; align-items: center; }
    .swap-row input, .swap-row select {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      width: 100%;
      outline: none;
    }
    .swap-row select option { background: var(--panel); color: var(--text); }

    .swap-submit {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
    }
    .swap-status { font-size: 12px; color: var(--muted); min-height: 18px; }

    /* Search & Category Functions */
    .controls-bar {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      display: grid;
      gap: 12px;
    }
    .search-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }

    .fn-tabs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    .fn-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .fn-btn {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .fn-btn.active { background: var(--accent); color: #111; border-color: var(--accent); }

    /* Market Table */
    .table-wrap {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; background: var(--panel-2); }
    tr.coin-row { cursor: pointer; transition: 0.12s; }
    tr.coin-row:hover { background: rgba(245, 185, 66, 0.08); }
    tr.coin-row.selected { background: rgba(245, 185, 66, 0.14); }
    .t-coin { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .t-coin img { width: 28px; height: 28px; border-radius: 50%; object-fit: contain; background: var(--panel-2); }
    .mini-btns { display: flex; gap: 6px; }
    .mini-buy, .mini-sell {
      padding: 5px 10px;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .mini-buy { background: var(--buy); }
    .mini-sell { background: var(--sell); }
  </style>
</head>
<body>

  <!-- TOP HEADER: NETWORKS & CURRENCY -->
  <header class="topbar">
    <div class="brand">
      <img src="https://avatars.githubusercontent.com/u/344742707?s=400&u=0f7650d8ff7c488797867a1ea945d95f2fe6ead4&v=4" alt="DimeX" />
      <span>DimeX Exchange <small>Chain ID: 1723 • DMXC</small></span>
    </div>

    <div class="network-strip" id="networkBar">
      <button class="net-btn active" data-net="ALL" onclick="selectNetwork('ALL')">All Networks</button>
      <button class="net-btn" data-net="DIMEX" onclick="selectNetwork('DIMEX')">DimeX Chain</button>
      <button class="net-btn" data-net="QOMX" onclick="selectNetwork('QOMX')">QOMX Chain</button>
      <button class="net-btn" data-net="BSC" onclick="selectNetwork('BSC')">BNB Chain</button>
      <button class="net-btn" data-net="ETH" onclick="selectNetwork('ETH')">Ethereum</button>
      <button class="net-btn" data-net="SOL" onclick="selectNetwork('SOL')">Solana</button>
    </div>

    <div class="currency-wrap">
      <label for="currencySelect" style="font-size:12px;color:var(--muted);">Currency:</label>
      <select id="currencySelect" class="currency-select" onchange="changeCurrency(this.value)">
        <option value="USD">USD ($)</option>
        <option value="INR">INR (₹)</option>
        <option value="EUR">EUR (€)</option>
        <option value="GBP">GBP (£)</option>
        <option value="JPY">JPY (¥)</option>
        <option value="AED">AED (د.إ)</option>
        <option value="SGD">SGD (S$)</option>
        <option value="CAD">CAD (C$)</option>
        <option value="AUD">AUD (A$)</option>
        <option value="CNY">CNY (¥)</option>
      </select>
    </div>
  </header>

  <main class="container">

    <!-- GRAPH + COIN DETAILS + BUY/SELL + SWAP -->
    <section class="stage">
      <div>
        <div class="coin-hero">
          <div class="coin-identity">
            <img id="heroLogo" src="" alt="Coin Logo" />

              <h2 id="heroName" style="font-size:20px;">Select Coin</h2>
              <small id="heroMeta" style="color:var(--muted);"></small>
            </div>
          </div>

            <div class="live-price" id="heroPrice">$0.00</div>
            <span class="pnl-tag pos" id="heroPnl">+0.00% (24h)</span>
          </div>
        </div>

        <div class="chart-box">
          <canvas id="priceChart" width="760" height="220"></canvas>
        </div>

        <div class="detail-grid">
          <div class="detail-card">
            <label>Rate (Current)</label>
            <strong id="detailRate">-</strong>
          </div>
          <div class="detail-card">
            <label>Market Cap</label>
            <strong id="detailMcap">-</strong>
          </div>
          <div class="detail-card">
            <label>Your Balance</label>
            <strong id="detailBalance">-</strong>
          </div>
          <div class="detail-card">

          <div class="detail-card">

            <strong id="detailNetClass">-</strong>
          </div>
          <div class="detail-card">
            <label>Fixed / Earn APR</label>
            <strong id="detailApr">-</strong>
          </div>
        </div>

        <div class="trade-actions">
          <button class="btn-buy" onclick="openSwap('BUY')">Buy (Green)</button>
          <button class="btn-sell" onclick="openSwap('SELL')">Sell (Red)</button>
        </div>
      </div>

      <!-- SWAP BOX -->
      <aside class="swap-panel" id="swapBox">
        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <h3 style="font-size:16px;">Instant Swap</h3>
            <span id="swapModeBadge" style="font-size:12px;font-weight:700;color:#4ade80;">BUY MODE</span>
          </div>

          <div class="swap-tabs">
            <button id="tabBuy" class="swap-tab buy-active" onclick="setSwapSide('BUY')">BUY</button>
            <button id="tabSell" class="swap-tab" onclick="setSwapSide('SELL')">SELL</button>
          </div>

          <div class="swap-field" style="margin-top:12px;">
            <div class="swap-field-top">
              <span id="payLabel">You Pay</span>
              <span id="payBal">Balance: 0.00</span>
            </div>
            <div class="swap-row">
              <input id="payAmount" type="number" step="any" value="100" oninput="calculateSwap()" />
              <select id="payAsset" onchange="calculateSwap()"></select>
            </div>
          </div>

          <div style="text-align:center;margin:8px 0;">
            <button class="net-btn" onclick="flipSwapAssets()">⇅ Switch Pair</button>
          </div>

          <div class="swap-field">
            <div class="swap-field-top">
              <span id="receiveLabel">You Receive</span>
              <span id="receiveBal">Rate: -</span>
            </div>
            <div class="swap-row">
              <input id="receiveAmount" type="text" readonly value="0.00" />
              <select id="receiveAsset" onchange="calculateSwap()"></select>
            </div>
          </div>
        </div>

        <div>
          <div class="swap-status" id="swapStatus">Ready to swap on selected network.</div>
          <button id="swapSubmitBtn" class="swap-submit" style="background:var(--buy);margin-top:8px;" onclick="executeSwap()">
            Swap Now
          </button>
        </div>
      </aside>
    </section>

    <!-- SEARCH + CATEGORY FUNCTIONS -->
    <section class="controls-bar">
      <input
        id="searchInput"
        class="search-input"
        type="text"
        placeholder="Search coin name, symbol, or contract address..."
        oninput="renderMarkets()"
      />

      <div class="fn-tabs">
        <div class="fn-group" id="fnButtons">
          <button class="fn-btn active" data-fn="trending" onclick="selectFunction('trending')">Trending</button>
          <button class="fn-btn" data-fn="native" onclick="selectFunction('native')">Native Token</button>
          <button class="fn-btn" data-fn="stocks" onclick="selectFunction('stocks')">Stocks</button>
          <button class="fn-btn" data-fn="pnl" onclick="selectFunction('pnl')">Profit & Loss Watching</button>
          <button class="fn-btn" data-fn="all" onclick="selectFunction('all')">All (Up to 75)</button>
        </div>
        <span id="marketCount" style="font-size:12px;color:var(--muted);font-weight:600;">Showing 0 coins</span>
      </div>
    </section>

    <!-- MARKET LIST TABLE -->
    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Coin</th>
            <th>Network</th>
            <th>Rate</th>
            <th>24h P&amp;L</th>
            <th>Market Cap</th>
            <th>Balance</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="marketBody"></tbody>
      </table>
    </section>

  </main>

      { id: "tslaw", symbol: "TSLAw", name: "Tesla Stock Price Tracker", network: "QOMX", class: "stock", trending: true, priceUsd: 382.88, pnlPct: 5.79, mcapUsd: 1225216000000, balance: 1.8, apr: "16.18% - 19.57%", logo: "https://avatars.githubusercontent.com/u/113091135" }
    ];

    // Expand up to 75 coins when "All (Up to 75)" is selected or total pool is needed
    function buildFullPool(targetCount = 75) {
      const pool = [...BASE_COINS];
      const extraNets = ["DIMEX", "QOMX", "BSC", "ETH", "SOL"];
      let idx = 1;
      while (pool.length < targetCount) {
        const base = BASE_COINS[idx % BASE_COINS.length];
        const net = extraNets[idx % extraNets.length];
        const factor = 0.85 + ((idx * 7) % 35) / 100;
        const pnl = Number((((idx % 11) - 5) * 1.35).toFixed(2));
        pool.push({
          ...base,
          id: `${base.id}_${idx}`,
          symbol: `${base.symbol}${idx}`,
          name: `${base.name} Pool #${idx}`,
          network: net,
          priceUsd: Number((base.priceUsd * factor).toFixed(6)),
          pnlPct: pnl,
          mcapUsd: Math.round(base.mcapUsd * factor),
          balance: Number(((idx * 13) % 500 + 5).toFixed(2))
        });
        idx++;
      }
      return pool;
    }

    let ALL_COINS = buildFullPool(75);
    let state = {
      network: "ALL",
      fn: "trending",
      currency: "USD",
      selectedId: "dmxc",
      swapSide: "BUY"
    };

    function formatMoney(usdValue) {
      const cur = CURRENCIES[state.currency] || CURRENCIES.USD;
      const val = Number(usdValue || 0) * cur.rate;
      const abs = Math.abs(val);
      const decimals = abs >= 1000 ? 2 : abs >= 1 ? 2 : 5;
      return `${cur.symbol}${val.toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals })}`;
    }

    function selectNetwork(net) {
      state.network = net;
      document.querySelectorAll(".net-btn").forEach(b => b.classList.toggle("active", b.dataset.net === net));
      renderMarkets();
    }

    function selectFunction(fnKey) {
      state.fn = fnKey;
      document.querySelectorAll(".fn-btn").forEach(b => b.classList.toggle("active", b.dataset.fn === fnKey));
      fetchFunctionEndpoint(fnKey);
      renderMarkets();
    }

    async function fetchFunctionEndpoint(fnKey) {
      const urlMap = {
        trending: API_ENDPOINTS.trending,
        native: API_ENDPOINTS.native,
        stocks: API_ENDPOINTS.stocks,
        pnl: API_ENDPOINTS.pnlWatch,
        all: API_ENDPOINTS.allMarkets
      };
      const url = urlMap[fnKey];
      if (!url) return;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (Array.isArray(data) && data.length) {
          ALL_COINS = data.slice(0, 75);
          renderMarkets();
        }
      } catch (e) {
        console.warn("API fallback active:", e);
      }
    }

    function changeCurrency(curCode) {
      state.currency = curCode;
      renderMarkets();
      renderStage();
      calculateSwap();
    }

    function getFilteredCoins() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      let list = ALL_COINS.filter(c => {
        const netOk = state.network === "ALL" || c.network === state.network;
        const searchOk = !q || c.name.toLowerCase().includes(q) || c.symbol.toLowerCase().includes(q) || c.network.toLowerCase().includes(q);
        return netOk && searchOk;
      });

      if (state.fn === "trending") list = list.filter(c => c.trending);
      if (state.fn === "native") list = list.filter(c => c.class === "native");
      if (state.fn === "stocks") list = list.filter(c => c.class === "stock");
      if (state.fn === "pnl") list = [...list].sort((a, b) => Math.abs(b.pnlPct) - Math.abs(a.pnlPct));

      return list.slice(0, 75);
    }

    function renderMarkets() {
      const list = getFilteredCoins();
      const tbody = document.getElementById("marketBody");
      document.getElementById("marketCount").textContent = `Showing ${list.length} coins (Max 75 / page)`;

      if (!list.length) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:24px;">No matching coins found.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map((c, i) => {
        const isPos = c.pnlPct >= 0;
        const balUsd = c.balance * c.priceUsd;
        return `
          <tr class="coin-row ${c.id === state.selectedId ? "selected" : ""}" onclick="selectCoin('${c.id}')">
            <td>${i + 1}</td>
            <td>
              <div class="t-coin">
                <img src="${c.logo}" alt="${c.symbol}" />
                <div>
                  <div>${c.symbol}</div>
                  <small style="color:var(--muted);font-weight:400;">${c.name}</small>
                </div>
              </div>
            </td>
            <td><span class="net-btn" style="padding:3px 9px;font-size:11px;">${c.network}</span></td>
            <td><strong>${formatMoney(c.priceUsd)}</strong></td>
            <td><span class="pnl-tag ${isPos ? "pos" : "neg"}">${isPos ? "+" : ""}${c.pnlPct}%</span></td>
            <td>${formatMoney(c.mcapUsd)}</td>
            <td>
              <div><strong>${c.balance} ${c.symbol}</strong></div>
              <small style="color:var(--muted);">${formatMoney(balUsd)}</small>
            </td>
            <td onclick="event.stopPropagation()">
              <div class="mini-btns">
                <button class="mini-buy" onclick="selectCoin('${c.id}'); openSwap('BUY');">Buy</button>
                <button class="mini-sell" onclick="selectCoin('${c.id}'); openSwap('SELL');">Sell</button>
              </div>
            </td>
          </tr>
        `;
      }).join("");
    }

    function selectCoin(id) {
      state.selectedId = id;
      renderMarkets();
      renderStage();
      populateSwapSelectors();
      calculateSwap();
    }

    function renderStage() {
      const coin = ALL_COINS.find(c => c.id === state.selectedId) || ALL_COINS[0];
      if (!coin) return;

      document.getElementById("heroLogo").src = coin.logo;
      document.getElementById("heroName").textContent = `${coin.name} (${coin.symbol})`;
      document.getElementById("heroMeta").textContent = `Network: ${coin.network} • Category: ${coin.class.toUpperCase()}`;
      document.getElementById("heroPrice").textContent = formatMoney(coin.priceUsd);

      const isPos = coin.pnlPct >= 0;
      const pnlEl = document.getElementById("heroPnl");
      pnlEl.className = `pnl-tag ${isPos ? "pos" : "neg"}`;
      pnlEl.textContent = `${isPos ? "+" : ""}${coin.pnlPct}% (24h P&L)`;

      document.getElementById("detailRate").textContent = formatMoney(coin.priceUsd);
      document.getElementById("detailMcap").textContent = formatMoney(coin.mcapUsd);
      document.getElementById("detailBalance").textContent = `${coin.balance} ${coin.symbol} (${formatMoney(coin.balance * coin.priceUsd)})`;
      document.getElementById("detailPnl").textContent = `${isPos ? "Profit" : "Loss"} ${isPos ? "+" : ""}${coin.pnlPct}%`;
      document.getElementById("detailNetClass").textContent = `${coin.network} / ${coin.class}`;
      document.getElementById("detailApr").textContent = coin.apr || "Dynamic";

      drawChart(coin);
    }

    function drawChart(coin) {
      const canvas = document.getElementById("priceChart");
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      // Generate deterministic sample series around coin.priceUsd
      const points = [];
      let seed = coin.symbol.split("").reduce((acc, ch) => acc + ch.charCodeAt(0), 0);
      let current = coin.priceUsd * (1 - coin.pnlPct / 100);
      for (let i = 0; i < 28; i++) {
        seed = (seed * 9301 + 49297) % 233280;
        const rnd = (seed / 233280 - 0.48) * 0.03;
        current = Math.max(0.00001, current * (1 + rnd));
        points.push(current);
      }
      points[points.length - 1] = coin.priceUsd;

      const minVal = Math.min(...points);
      const maxVal = Math.max(...points);
      const span = maxVal - minVal || 1;
      const padX = 24;
      const padY = 20;

      // Grid lines
      ctx.strokeStyle = "#1f2b42";
      ctx.lineWidth = 1;
      for (let g = 0; g <= 4; g++) {
        const gy = padY + ((h - padY * 2) / 4) * g;
        ctx.beginPath();
        ctx.moveTo(padX, gy);
        ctx.lineTo(w - padX, gy);
        ctx.stroke();
      }

      // Price curve
      const strokeColor = coin.pnlPct >= 0 ? "#4ade80" : "#f87171";
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      points.forEach((val, idx) => {
        const x = padX + ((w - padX * 2) / (points.length - 1)) * idx;
        const y = h - padY - ((val - minVal) / span) * (h - padY * 2);
        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    function openSwap(side) {
      setSwapSide(side);
      document.getElementById("swapBox").scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function setSwapSide(side) {
      state.swapSide = side;
      const isBuy = side === "BUY";
      document.getElementById("tabBuy").className = `swap-tab ${isBuy ? "buy-active" : ""}`;
      document.getElementById("tabSell").className = `swap-tab ${!isBuy ? "sell-active" : ""}`;
      document.getElementById("swapModeBadge").textContent = isBuy ? "BUY MODE" : "SELL MODE";
      document.getElementById("swapModeBadge").style.color = isBuy ? "#4ade80" : "#f87171";
      document.getElementById("swapSubmitBtn").style.background = isBuy ? "var(--buy)" : "var(--sell)";
      document.getElementById("swapSubmitBtn").textContent = isBuy ? "Execute Buy Swap" : "Execute Sell Swap";
      populateSwapSelectors();
      calculateSwap();
    }

    function populateSwapSelectors() {
      const selected = ALL_COINS.find(c => c.id === state.selectedId) || ALL_COINS[0];
      const usdc = ALL_COINS.find(c => c.symbol === "USDC") || ALL_COINS[1];
      const paySel = document.getElementById("payAsset");
      const recSel = document.getElementById("receiveAsset");

      const optionsHtml = ALL_COINS.slice(0, 25).map(c =>
        `<option value="${c.id}">${c.symbol} (${c.network})</option>`
      ).join("");

      paySel.innerHTML = optionsHtml;
      recSel.innerHTML = optionsHtml;

      if (state.swapSide === "BUY") {
        paySel.value = usdc.id;
        recSel.value = selected.id;
      } else {
        paySel.value = selected.id;
        recSel.value = usdc.id;
      }
    }

    function flipSwapAssets() {
      const paySel = document.getElementById("payAsset");
      const recSel = document.getElementById("receiveAsset");
      const temp = paySel.value;
      paySel.value = recSel.value;
      recSel.value = temp;
      calculateSwap();
    }

    function calculateSwap() {
      const payCoin = ALL_COINS.find(c => c.id === document.getElementById("payAsset").value) || ALL_COINS[0];
      const recCoin = ALL_COINS.find(c => c.id === document.getElementById("receiveAsset").value) || ALL_COINS[1];
      const amt = parseFloat(document.getElementById("payAmount").value) || 0;

      document.getElementById("payBal").textContent = `Balance: ${payCoin.balance} ${payCoin.symbol}`;
      const rate = payCoin.priceUsd / (recCoin.priceUsd || 1);
      const outAmt = amt * rate;

      document.getElementById("receiveAmount").value = outAmt.toFixed(6);
      document.getElementById("receiveBal").textContent = `1 ${payCoin.symbol} ≈ ${rate.toFixed(6)} ${recCoin.symbol} (${formatMoney(payCoin.priceUsd)})`;
    }

    function executeSwap() {
      const payCoin = ALL_COINS.find(c => c.id === document.getElementById("payAsset").value);
      const recCoin = ALL_COINS.find(c => c.id === document.getElementById("receiveAsset").value);
      const amt = parseFloat(document.getElementById("payAmount").value) || 0;
      const outAmt = parseFloat(document.getElementById("receiveAmount").value) || 0;

      if (!payCoin || !recCoin || amt <= 0) return;
      if (amt > payCoin.balance) {
        document.getElementById("swapStatus").textContent = `Insufficient ${payCoin.symbol} balance.`;
        return;
      }

      payCoin.balance = Number((payCoin.balance - amt).toFixed(6));
      recCoin.balance = Number((recCoin.balance + outAmt).toFixed(6));
      document.getElementById("swapStatus").textContent =
        `${state.swapSide} completed: Swapped ${amt} ${payCoin.symbol} → ${outAmt.toFixed(4)} ${recCoin.symbol}.`;

      renderMarkets();
      renderStage();
      calculateSwap();
    }

    // Init
    selectCoin("dmxc");
  </script>
</body>
</html>
